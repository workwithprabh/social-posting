<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;font-weight:500;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-500-normal.woff2)}
@font-face{font-family:Mont;font-weight:600;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Mont;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Mont;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Play;font-weight:700;font-style:italic;src:url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-italic.woff2)}
@font-face{font-family:Gur;font-weight:700;src:url(node_modules/@fontsource/noto-serif-gurmukhi/files/noto-serif-gurmukhi-gurmukhi-700-normal.woff2)}
/* Gurpurab post, centred medallion design (second design, 24 Nov 2026): night photo background, the illustration in a
   round gold frame at the top, centred greeting and teaching, client footer. Nothing in the top-right corner. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Mont,sans-serif;color:#fff8e8;background:#060404;position:relative;--g1:#fff1c9;--g2:#f3c46a;--g3:#c98a2c}
.bg{position:absolute;inset:0;background-repeat:no-repeat;background-size:var(--bs,cover);background-position:var(--bp,center);filter:saturate(1.05)}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,4,4,.86) 0%,rgba(6,4,4,.55) 30%,rgba(6,4,4,.50) 46%,rgba(8,5,3,.80) 62%,rgba(8,5,3,.94) 78%,rgba(6,4,2,.98) 100%)}
header{position:absolute;left:0;right:0;top:54px;display:flex;justify-content:center;z-index:3}
.med{position:absolute;left:50%;top:var(--mt,140px);width:var(--md,380px);height:var(--md,380px);transform:translateX(-50%);border-radius:50%;z-index:2;
 background:var(--mimg) no-repeat;background-size:var(--ms,118%);background-position:var(--mp,50% 18%);
 box-shadow:0 0 0 6px #e4b25a,0 0 0 14px rgba(228,178,90,.25),0 0 60px 18px rgba(255,200,110,.35)}
.txt{position:absolute;left:72px;right:72px;top:var(--tt,560px);text-align:center;z-index:2}
.gwish{font-family:Gur;font-weight:700;font-size:40px;line-height:1.3;
 background:linear-gradient(180deg,var(--g1),var(--g2) 60%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-weight:700;font-size:var(--h1,84px);line-height:1.04;letter-spacing:-1.5px;margin-top:2px;color:#fff}
.orn{margin:22px auto 18px;width:420px;height:2px;background:linear-gradient(90deg,transparent,var(--g2),transparent)}
.gur{font-family:Gur;font-weight:700;font-size:56px;line-height:1.25;
 background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.lname{font-family:Play;font-style:italic;font-weight:700;font-size:70px;line-height:1.05;color:#fff}
.meaning{margin-top:8px;font-weight:700;font-size:32px;color:var(--g2)}
.line{margin:10px auto 0;font-weight:500;font-size:26px;line-height:1.4;max-width:780px;opacity:.9}
.rule{position:absolute;left:72px;right:72px;bottom:178px;height:1px;background:rgba(255,240,210,.22);z-index:2}
footer{position:absolute;left:0;right:0;bottom:0;height:178px;padding:0 72px 50px;display:flex;flex-direction:column;justify-content:flex-end;z-index:3;text-align:center}
.big{font-weight:800;font-size:28px;letter-spacing:1px}
.ph{font-weight:800;font-size:34px;letter-spacing:.5px;color:var(--g2);margin-top:4px}
.fsub{margin-top:10px;font-weight:600;font-size:19px;letter-spacing:2px;opacity:.8}
.note{position:absolute;left:72px;right:72px;bottom:16px;font-weight:500;font-size:13px;opacity:.5;text-align:center;z-index:3}
</style></head><body><div id="root"></div>
<script>
const FOOT={
 DEH:`<div class="big">DEE EMM HYUNDAI GURGAON · <span class="ph">97736 47900</span></div><div class="fsub">SECTOR 16 | SECTOR 49 · DAULATABAD · SECTOR 18 | SIKANDERPUR</div>`};
function render(c){
 document.body.setAttribute('style',Object.entries(c.vars||{}).map(([k,v])=>`--${k}:${v}`).join(';')+`;--mimg:url(${c.med})`);
 document.getElementById('root').innerHTML=`<div class="bg" style="background-image:url(${c.img})"></div><div class="veil"></div>
 <header><img src="${c.logo}" style="height:${c.logoH}px"></header>
 <div class="med"></div>
 <div class="txt"><div class="gwish">${c.gwish}</div><h1>${c.wish}</h1><div class="orn"></div>
  <div class="gur">${c.gur}</div><div class="lname">${c.lesson}</div><div class="meaning">${c.meaning}</div><div class="line">${c.line}</div></div>
 <div class="rule"></div><footer>${FOOT[c.footer]}</footer>${c.note?`<div class="note">${c.note}</div>`:''}`;
 const t=document.querySelector('.txt').getBoundingClientRect();
 return {txtTop:Math.round(t.top),txtBottom:Math.round(t.bottom)};
}
</script></body></html>
