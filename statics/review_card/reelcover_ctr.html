<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Mont;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Mont;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2)}
/* High-CTR reel cover (user, 17 Nov 2026: covers must be catchy, big and bold, high CTR). One hook from the reel's own
   story, a big bright cut-out hero, a sticker with the payoff, bold pills. Text inside y 240-1680 (grid crop). */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Mont,sans-serif;color:#fff;position:relative;--acc:#FFD21F;--blue:#00AAD2;--navy:#002C5F;background:var(--navy)}
.bg{position:absolute;inset:0;background:
  radial-gradient(760px 620px at 55% 62%,rgba(0,170,210,.95) 0%,rgba(0,120,190,.65) 38%,rgba(0,44,95,0) 75%),
  linear-gradient(180deg,#00122b 0%,#002C5F 45%,#00376f 70%,#00122b 100%)}
.rays{position:absolute;left:-400px;top:-200px;width:1900px;height:2200px;
  background:repeating-conic-gradient(from 0deg at 55% 52%,rgba(255,255,255,.07) 0deg 6deg,rgba(255,255,255,0) 6deg 16deg);
  -webkit-mask-image:radial-gradient(closest-side at 55% 52%,#000 20%,transparent 75%);mask-image:radial-gradient(closest-side at 55% 52%,#000 20%,transparent 75%)}
.ground{position:absolute;left:0;right:0;top:var(--gy,1360px);bottom:0;background:linear-gradient(180deg,rgba(170,225,255,.35) 0,rgba(0,90,160,.55) 3px,rgba(0,60,120,.55) 90px,rgba(0,22,52,.9) 300px,#000c1f 100%)}
.ground:after{content:'';position:absolute;left:var(--lx,-60px);width:var(--lw,1200px);top:var(--ly,10px);height:var(--lh,260px);background:radial-gradient(50% 50% at 50% 45%,rgba(120,200,255,.55),rgba(60,150,230,.25) 55%,rgba(0,60,120,0) 100%)}
.ground:before{content:'';position:absolute;left:0;right:0;top:-160px;height:160px;background:linear-gradient(180deg,rgba(0,44,95,0),rgba(0,60,120,.35))}
.hero{position:absolute;left:var(--hx,-90px);top:var(--hy,700px);width:var(--hw,1260px)}
.floor{position:absolute;left:0;right:0;top:var(--fy,1370px);height:160px;background:radial-gradient(50% 40% at 50% 30%,rgba(0,0,0,.55),rgba(0,0,0,0))}
.head{position:absolute;left:60px;right:60px;top:var(--ht,250px)}
.kick{display:inline-block;background:var(--acc);color:var(--navy);font-weight:900;font-size:40px;padding:8px 20px;transform:rotate(-2deg);letter-spacing:1px}
h1{margin-top:22px;font-weight:900;font-size:var(--h1,128px);line-height:.98;letter-spacing:-3.5px;text-shadow:0 8px 0 rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.5)}
h1 em{font-style:normal;color:var(--acc)}
.sticker{position:absolute;left:var(--sx,640px);top:var(--sy,640px);width:var(--sw,380px);height:var(--sw,380px);transform:rotate(var(--sr,-10deg));
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--navy);
  background:var(--acc);clip-path:polygon(50% 0%,59% 9%,71% 4%,76% 16%,89% 15%,88% 28%,99% 35%,92% 46%,100% 56%,90% 64%,94% 77%,81% 80%,78% 93%,65% 90%,56% 100%,47% 91%,35% 97%,29% 85%,16% 86%,15% 73%,3% 67%,10% 56%,1% 45%,11% 36%,5% 23%,18% 18%,21% 6%,34% 9%,42% 0%);
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
.sticker small{font-weight:900;font-size:34px;line-height:1}
.sticker b{font-weight:900;font-size:var(--sb,92px);line-height:.95;letter-spacing:-3px;white-space:nowrap}
.sticker i{font-style:normal;font-weight:800;font-size:30px;line-height:1.1}
.foot{position:absolute;left:60px;right:60px;bottom:var(--fb,250px)}
.pills{display:flex;flex-wrap:wrap;gap:16px}
.pill{font-weight:900;font-size:var(--pf,40px);padding:14px 26px;border-radius:60px;background:#fff;color:var(--navy);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.note{margin-top:18px;font-weight:800;font-size:32px;text-shadow:0 3px 10px rgba(0,0,0,.6)}
</style></head><body><div id="root"></div>
<script>
function render(c){
 document.body.setAttribute('style',Object.entries(c.vars||{}).map(([k,v])=>`--${k}:${v}`).join(';'));
 document.getElementById('root').innerHTML=`<div class="bg"></div><div class="rays"></div><div class="floor"></div><div class="ground"></div><img class="hero" src="${c.img}">
 <div class="head">${c.kick?`<span class="kick">${c.kick}</span>`:''}<h1>${c.hook}</h1></div>
 ${c.sticker?`<div class="sticker">${c.sticker}</div>`:''}
 <div class="foot"><div class="pills">${(c.pills||[]).map(x=>`<div class="pill">${x}</div>`).join('')}</div>${c.note?`<div class="note">${c.note}</div>`:''}</div>`;
 const hd=document.querySelector('.head').getBoundingClientRect(), ft=document.querySelector('.foot').getBoundingClientRect();
 return {headBottom:Math.round(hd.bottom), footTop:Math.round(ft.top), footBottom:Math.round(ft.bottom)};
}
</script></body></html>
