<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:Mont;font-weight:500;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-500-normal.woff2)}
@font-face{font-family:Mont;font-weight:600;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Mont;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Mont;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Mont,sans-serif;color:#fff;position:relative;background:#050506}
.bayon{--acc:#E4002B;--chip:rgba(255,255,255,.08);--bg:#060607}
.mahindra{--acc:#E31837;--chip:rgba(255,255,255,.10);--bg:#0b0b0d}
.bg{position:absolute;inset:0;background:var(--bg)}
.car{position:absolute;left:0;right:0;top:var(--ct,330px);height:var(--ch,700px);background-size:cover;background-position:var(--cp,center);
 -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 78%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 78%,transparent 100%)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.85) 80%,var(--bg) 100%)}
header{position:absolute;left:72px;right:72px;top:64px;height:130px;display:flex;align-items:center;justify-content:space-between}
header img{display:block}
.tag{font-weight:700;font-size:22px;letter-spacing:5px;padding:12px 20px;border:2px solid rgba(255,255,255,.55);border-radius:40px}
.head{position:absolute;left:72px;right:72px;top:220px}
.kicker{font-weight:700;font-size:24px;letter-spacing:6px;color:var(--acc)}
h1{margin-top:10px;font-weight:800;font-size:var(--h1,108px);line-height:1;letter-spacing:-2px}
h1 em{font-style:normal;color:var(--acc)}
.mahindra h1{font-family:Anton;font-weight:400;letter-spacing:1px;font-size:var(--h1,112px);line-height:1;text-transform:uppercase}
.sub{margin-top:18px;font-weight:600;font-size:30px;line-height:1.3;max-width:900px;opacity:.95}
.chips{position:absolute;left:72px;right:72px;top:var(--chipt,1000px);display:flex;gap:16px}
.chip{flex:1;background:var(--chip);border:1.5px solid rgba(255,255,255,.18);border-radius:18px;padding:18px 18px;font-weight:700;font-size:23px;line-height:1.25;backdrop-filter:blur(6px)}
.chip:before{content:"";display:block;width:34px;height:5px;border-radius:3px;background:var(--acc);margin-bottom:12px}
.price{position:absolute;right:72px;top:var(--pt,890px);background:var(--acc);border-radius:14px;padding:12px 22px;text-align:right;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.price small{display:block;font-weight:700;font-size:18px;letter-spacing:2px;opacity:.95}
.price b{display:block;font-weight:800;font-size:44px;line-height:1.1}
footer{position:absolute;left:0;right:0;bottom:0;height:230px;padding:0 72px 64px;display:flex;flex-direction:column;justify-content:flex-end}
.fine{position:absolute;left:72px;right:72px;bottom:18px;font-weight:500;font-size:14px;opacity:.6;text-align:center}
.rule{display:flex;align-items:center;gap:20px;font-weight:700;font-size:22px;letter-spacing:4px;margin-bottom:22px}
.rule:before,.rule:after{content:"";flex:1;height:2px;background:rgba(255,255,255,.35)}
.cols{display:flex;justify-content:space-between}
.cols div{font-weight:600;font-size:22px;opacity:.8}
.cols div b{display:block;font-weight:800;font-size:27px;opacity:1;margin-top:6px;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.big{font-weight:800;font-size:34px;letter-spacing:1px}
.mahindra .big{font-family:Anton;font-weight:400;font-size:44px;letter-spacing:1.5px;line-height:1.05}
.ph{font-weight:800;font-size:40px;white-space:nowrap}
.fsub{margin-top:14px;font-weight:600;font-size:22px;letter-spacing:2px;opacity:.8}
.loc{white-space:nowrap;text-align:right;font-weight:600;font-size:22px;line-height:1.4;opacity:.9}
.loc b{font-weight:800;font-size:26px;letter-spacing:3px}
.pin{color:var(--acc)}

.car{top:var(--ct,330px);height:var(--ch,520px)}
.panel{position:absolute;left:72px;right:72px;top:var(--pt,800px);display:flex;gap:22px}
.tbl{flex:1.55;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);border-radius:22px;padding:22px 28px}
.tr{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:24px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.tr span{opacity:.82}
.tr b{font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.tr.tot{border-bottom:0;padding-top:14px}
.tr.tot span{opacity:1;font-weight:800;font-size:26px}
.tr.tot b{font-size:34px;color:#fff}
.emi{flex:1;background:var(--acc);border-radius:22px;padding:24px 24px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.emi small{font-weight:700;font-size:20px;letter-spacing:3px;opacity:.95}
.emi b{display:block;font-weight:800;font-size:52px;line-height:1.05;margin:8px 0 2px}
.emi i{font-style:normal;font-weight:700;font-size:22px;opacity:.95}
.emi p{margin-top:14px;font-weight:600;font-size:19px;line-height:1.35;opacity:.95}
.mahindra .emi b{font-family:Anton;font-weight:400;font-size:62px;letter-spacing:1px}
</style></head><body><div class="bg"></div><div id="root"></div>
<script>
const FOOT={
 CH:`<div class="rule">CAPITAL HYUNDAI SHOWROOMS</div><div class="cols"><div>Sector 63, Noida<b>99994 89444</b></div><div>Sector 132, Noida<b>73031 11937</b></div><div>Dadri<b>72900 77273</b></div><div>Faridabad<b>93559 31054</b></div></div>`,
 DEH:`<div class="row"><div class="big">DEE EMM HYUNDAI GURGAON</div><div class="ph">97736 47900</div></div><div class="fsub">SECTOR 16 | SECTOR 49 · DAULATABAD · SECTOR 18 | SIKANDERPUR</div>`,
 MRH:`<div class="row"><div><div class="big">SHOWROOM &amp; SERVICE</div><div class="fsub">Loni Rd, opp. Shalimar Garden, Pasonda, Sahibabad</div></div><div class="loc"><b><span class="pin">&#9679;</span> GHAZIABAD</b><br>Pasonda, Shalimar Garden<br><span class="ph">93128 21182</span></div></div>`,
 DEM:`<div class="row"><div class="big">BOOK YOUR SUV WITH<br>DEE EMM MAHINDRA</div><div class="ph">95995 58379</div></div>`,
 AM:`<div class="row"><div class="big">BOOK YOUR SUV WITH<br>MAHINDRA ARAV TODAY</div><div class="loc"><b><span class="pin">&#9679;</span> GURGAON</b><br>Manesar · Sector 95 · Sector 83<br><span class="ph">88600 86639</span></div></div>`};
function render(c){
 document.body.className=c.theme;
 document.body.setAttribute('style',Object.entries(c.vars||{}).map(([k,v])=>`--${k}:${v}`).join(';'));
 const rows=c.rows.map(([k,v])=>`<div class="tr"><span>${k}</span><b>${v}</b></div>`).join('');
 document.getElementById('root').innerHTML=`<div class="car" style="background-image:url(${c.img})"></div><div class="shade"></div>
 <header><img src="${c.logo}" style="height:${c.logoH}px"><div class="tag">${c.tag}</div></header>
 <div class="head"><div class="kicker">${c.kicker}</div><h1>${c.headline}</h1><div class="sub">${c.sub}</div></div>
 <div class="panel"><div class="tbl">${rows}<div class="tr tot"><span>${c.totalLabel}</span><b>${c.total}</b></div></div>
 <div class="emi"><small>EMI FROM</small><b>${c.emi}</b><i>per month*</i><p>${c.emiNote}</p></div></div>
 <footer>${FOOT[c.footer]}</footer><div class="fine">${c.fine}</div>`;
 const p=document.querySelector('.panel').getBoundingClientRect(), h=document.querySelector('.head').getBoundingClientRect();
 return {headBottom:Math.round(h.bottom), panelTop:Math.round(p.top), panelBottom:Math.round(p.bottom)};
}
</script></body></html>
