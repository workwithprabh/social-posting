<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Brico;font-weight:700;src:url(node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-700-normal.woff2)}
@font-face{font-family:Brico;font-weight:800;src:url(node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:Roboto;font-weight:400;src:url(node_modules/@fontsource/roboto/files/roboto-latin-400-normal.woff2)}
@font-face{font-family:Roboto;font-weight:500;src:url(node_modules/@fontsource/roboto/files/roboto-latin-500-normal.woff2)}
@font-face{font-family:Hand;font-weight:700;src:url(node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2)}
/* Capital Hyundai house style v2 (user, 25 Nov 2026: the client found the posts "too AI"; it should look made by a
   designer, simple but unique, not like other Hyundai posts). Flat warm paper with grain, Hyundai navy, one yellow
   marker highlight, Bricolage Grotesque headlines, handwritten notes in Caveat. No glows, no gradients, no glass.
   kinds: review (Google review shown like a screenshot, key words highlighted), emiday (EMI worked out per day),
   spec (model name set big behind the car, handwritten callouts). */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Inter,sans-serif;color:var(--navy);position:relative;--navy:#0B2A55;--paper:#F2EEE6;--mk:#FFE14D;background:var(--paper)}
.pat{position:absolute;inset:0;z-index:0;pointer-events:none;-webkit-mask-image:var(--pm,radial-gradient(120% 90% at 85% 30%,#000 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.12) 80%));mask-image:var(--pm,radial-gradient(120% 90% at 85% 30%,#000 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.12) 80%))}
.grain{position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply;pointer-events:none;z-index:0;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .36  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
mark{background:none;color:var(--mkfg,inherit);position:relative;z-index:0;white-space:nowrap}
mark:before{content:"";position:absolute;left:-.12em;right:-.12em;top:var(--mkt,.42em);bottom:var(--mkb,.02em);background:var(--mk);z-index:-1;border-radius:.12em .3em .2em .35em;transform:rotate(-.6deg)}
mark.w{white-space:normal;color:inherit;background:linear-gradient(transparent 46%,var(--mkw,var(--mk)) 46%,var(--mkw,var(--mk)) 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .08em}
mark.w:before{display:none}
header{position:absolute;left:72px;top:64px;z-index:3}
.kick{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px;letter-spacing:.5px}
h1{font-family:Brico;font-weight:800;letter-spacing:-1.5px;line-height:1.02}
.hand{font-family:Hand;font-weight:700;color:var(--hand,var(--navy));position:absolute;z-index:4;line-height:1}
.arrow{position:absolute;z-index:4;overflow:visible}
.pcard{position:absolute;z-index:3;background:#fff;padding:10px;border-radius:4px;box-shadow:0 14px 30px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.10)}
.pcard img{display:block;width:100%;height:100%;object-fit:cover}
footer{position:absolute;left:72px;right:72px;bottom:44px;z-index:3}
.frule{display:flex;align-items:center;gap:16px;font-weight:800;font-size:17px;letter-spacing:3px;margin-bottom:14px}
.frule:after{content:"";flex:1;height:2px;background:var(--rule,var(--navy))}
.cols{display:flex;justify-content:space-between}
.cols div{font-weight:500;font-size:19px}
.cols b{display:block;font-weight:800;font-size:25px;margin-top:2px;letter-spacing:.3px}
.grid{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;row-gap:10px}
.grid div{font-weight:500;font-size:17px}.grid b{display:block;font-weight:800;font-size:22px;margin-top:1px}
.fine{position:absolute;left:72px;right:72px;bottom:12px;font-weight:500;font-size:11.5px;line-height:1.35;opacity:.7;z-index:3}
/* review */
.rv h1{position:absolute;left:72px;right:72px;top:var(--ht,210px);font-size:var(--h1,80px);z-index:3}
.rv .kick{position:absolute;left:72px;top:var(--kt,170px)}
.card{position:absolute;left:var(--cx,90px);width:var(--cw,900px);top:var(--ct,560px);background:#fff;border-radius:22px;padding:34px 38px 36px;z-index:3;
 transform:rotate(var(--cr,-1.4deg));box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 30px rgba(40,30,10,.12),0 30px 60px rgba(40,30,10,.08);font-family:Roboto,sans-serif;color:#202124}
.card .top{display:flex;align-items:center;gap:18px}
.av{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:500 32px Roboto}
.who b{display:block;font-weight:500;font-size:28px}
.who span{display:block;font-size:20px;color:#5f6368;margin-top:2px}
.card .g{margin-left:auto;width:46px;height:46px}
.stars{display:flex;align-items:center;gap:10px;margin:18px 0 14px;font-size:20px;color:#5f6368}
.stars i{font-style:normal;color:var(--star,#FBBC04);font-size:30px;letter-spacing:2px}
.rtext{font-size:var(--rs,29px);line-height:1.5;color:#3c4043;white-space:pre-line}
.rtext mark.w{color:#202124}
/* emi per day */
.em .kick{position:absolute;left:72px;top:176px}
.em .l1{position:absolute;left:72px;top:var(--l1t,214px);font-family:Brico;font-weight:700;font-size:var(--l1s,60px);letter-spacing:-1px;line-height:1.08}
.em .l1 b{font-weight:800;font-size:1.22em;letter-spacing:-1.5px}
.em .big{position:absolute;left:62px;top:var(--bt,272px);font-family:Brico;font-weight:800;font-size:var(--bs,250px);letter-spacing:-8px;line-height:1;z-index:2}
.em .big mark:before{top:.6em;bottom:.12em;left:-.04em;right:-.06em}
.em .car{position:absolute;z-index:2}
.calc{position:absolute;left:72px;top:var(--ct2,600px);width:var(--cw2,286px);z-index:3;font-family:Inter;font-variant-numeric:tabular-nums}
.calc .ch{font-weight:800;font-size:14px;letter-spacing:2.5px;margin-bottom:8px}
.calc .r{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(11,42,85,.22);font-size:19px}
.calc .r span{font-weight:500;opacity:.8}.calc .r b{font-weight:700}
.calc .t{display:flex;justify-content:space-between;align-items:baseline;padding-top:9px;border-top:2px solid var(--navy);margin-top:-1px}
.calc .t span{font-weight:800;font-size:19px}.calc .t b{font-family:Brico;font-weight:800;font-size:34px;letter-spacing:-.5px}
.det{position:absolute;left:72px;right:72px;top:var(--dt,1000px);font-weight:600;font-size:20px;line-height:1.45;z-index:3}
.pill{display:inline-flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:60px;padding:16px 28px;font-weight:700;font-size:23px;margin-top:16px}
/* spec */
.sp .kick{position:absolute;left:72px;top:176px}
.sp .model{position:absolute;left:0;right:0;top:var(--mt,200px);text-align:center;font-family:Brico;font-weight:800;font-size:var(--ms,300px);letter-spacing:-10px;line-height:1;z-index:1;color:var(--mc,var(--navy))}
.sp .car{position:absolute;z-index:2}
.sp .tag{position:absolute;left:72px;right:72px;top:var(--tt,860px);z-index:3}
.sp .tag h1{font-size:var(--h1,60px)}
.feats{display:flex;flex-wrap:wrap;gap:10px 12px;margin-top:20px}
.feats span{font-weight:700;font-size:20px;padding:9px 16px;border:2px solid var(--navy);border-radius:40px}
.sh .kick{position:absolute;left:72px;right:72px;top:172px;display:flex;justify-content:space-between}
.sh .kick small{font-weight:700;font-size:16px;letter-spacing:3px;opacity:.7}
.sh h1{position:absolute;left:72px;right:72px;top:var(--ht,206px);font-size:var(--h1,92px)}
.sh .car{position:absolute;z-index:2}
.dim{position:absolute;inset:0;z-index:3;overflow:visible}
.dl{font:700 17px Inter;letter-spacing:2px;fill:#0B2A55}
.num{position:absolute;z-index:4;width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font:800 19px Inter;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--paper)}
.legend{position:absolute;left:72px;right:72px;top:var(--lgt,930px);display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--navy);z-index:3}
.legend div{display:flex;gap:12px;align-items:flex-start;padding:16px 14px 14px 0;font-weight:700;font-size:20px;line-height:1.25}
.legend div+div{border-left:1px solid rgba(11,42,85,.3);padding-left:16px}
.legend i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font:800 15px Inter;font-style:normal;display:flex;align-items:center;justify-content:center}
.data{position:absolute;left:72px;right:72px;top:var(--dtt,1035px);font-weight:600;font-size:19px;z-index:3}
.data .pill{margin-top:14px}
</style></head><body><div class="pat" id="pat"></div><div class="grain"></div><div id="root"></div>
<script>
const G=`<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>`;
const FOOT={
 CH:`<div class="frule">CAPITAL HYUNDAI SHOWROOMS</div><div class="cols"><div>Sector 63, Noida<b>99994 89444</b></div><div>Sector 132, Noida<b>73031 11937</b></div><div>Dadri<b>72900 77273</b></div><div>Faridabad<b>93559 31054</b></div></div>`,
 DEM_SVC:`<div class="frule">DEE EMM MAHINDRA SERVICE</div><div class="cols"><div>Sector 35 service centre<b>92890 32858</b></div><div style="text-align:right">NH-08, Narsinghpur<b>Gurgaon</b></div></div>`,
 CH_SVC:`<div class="frule">CAPITAL HYUNDAI SERVICE CENTRES</div><div class="grid"><div>Sector 132, Noida<b>73031 11937</b></div><div>Sector 63, Noida<b>99994 89444</b></div><div>Sector 58, Noida<b>84480 96129</b></div><div>Sector 3, Noida<b>97177 92239</b></div><div>Sector 83, Noida<b>95606 11466</b></div><div>Faridabad<b>93559 31002</b></div><div>Dadri<b>072900 79106</b></div></div>`};
// hand-drawn arrow: from (x1,y1) to (x2,y2) with a bend
function arrow(a){const [x1,y1,x2,y2,b]=a;const mx=(x1+x2)/2+(b||0),my=(y1+y2)/2-(b||0)*.4;
 const ang=Math.atan2(y2-my,x2-mx),h=18,s=.5;const p1=[x2-h*Math.cos(ang-s),y2-h*Math.sin(ang-s)],p2=[x2-h*Math.cos(ang+s),y2-h*Math.sin(ang+s)];
 return `<svg class="arrow" style="left:0;top:0" width="1080" height="1350"><path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" style="stroke:var(--hand,var(--navy))" stroke-width="3.2" stroke-linecap="round"/><path d="M${p1[0]} ${p1[1]} L${x2} ${y2} L${p2[0]} ${p2[1]}" fill="none" style="stroke:var(--hand,var(--navy))" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function hands(c){return (c.notes||[]).map(n=>`<div class="hand" style="left:${n.x}px;top:${n.y}px;font-size:${n.s||40}px;transform:rotate(${n.r||-3}deg)">${n.t}</div>${n.a?arrow(n.a):''}`).join('')}
function car(c){return c.car?`<img class="car" src="${c.car.src}" style="left:${c.car.x}px;top:${c.car.y}px;width:${c.car.w}px">`:''}
function jewel(on){ // Hyundai-style parametric jewel facets: a diamond grid, each diamond split in 4 shaded triangles
 if(!on) return ''; let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
 const W=1080,H=1350,a=64,b=40; let t='';
 for(let row=-1;row*b<H+b;row++){for(let col=-1;col*a<W+a;col++){
  const cx=col*a+(row%2?a/2:0), cy=row*b, T=[cx,cy-b/2*1], R=[cx+a/2,cy], B=[cx,cy+b/2*1], L=[cx-a/2,cy], C=[cx,cy];
  for(const [p,q] of [[T,R],[R,B],[B,L],[L,T]]){const o=(0.015+rnd()*0.075).toFixed(3);
   t+=`<path d="M${C[0]} ${C[1]}L${p[0]} ${p[1]}L${q[0]} ${q[1]}Z" fill="#0B2A55" fill-opacity="${o}"/>`}
  t+=`<path d="M${T[0]} ${T[1]}L${R[0]} ${R[1]}L${B[0]} ${B[1]}L${L[0]} ${L[1]}Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1"/>`}}
 return `<svg width="1080" height="1350" viewBox="0 0 1080 1350">${t}</svg>`}

function sheet(c){ // technical drawing: dimension lines + numbered callouts on a side view
 const k=c.car, sc=k.w/2240, X=v=>k.x+v*2*sc, Y=v=>k.y+v*2*sc;
 const x0=X(k.bx0),x1=X(k.bx1),yt=Y(k.by0),yb=Y(k.by1), ly=yb+44, hx=x1+46;
 const tick=(x,y,v)=>v?`<line x1="${x-9}" y1="${y}" x2="${x+9}" y2="${y}" stroke="#0B2A55" stroke-width="2"/>`:`<line x1="${x}" y1="${y-9}" x2="${x}" y2="${y+9}" stroke="#0B2A55" stroke-width="2"/>`;
 const mid=(x0+x1)/2, hm=(yt+yb)/2;
 let g=`<svg class="dim" width="1080" height="1350">
  <line x1="${x0}" y1="${yb-30}" x2="${x0}" y2="${ly+12}" stroke="#0B2A55" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
  <line x1="${x1}" y1="${yb-30}" x2="${x1}" y2="${ly+12}" stroke="#0B2A55" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
  <line x1="${x0}" y1="${ly}" x2="${mid-70}" y2="${ly}" stroke="#0B2A55" stroke-width="1.6"/><line x1="${mid+70}" y1="${ly}" x2="${x1}" y2="${ly}" stroke="#0B2A55" stroke-width="1.6"/>
  ${tick(x0,ly)}${tick(x1,ly)}<text class="dl" x="${mid}" y="${ly+6}" text-anchor="middle">${c.len}</text>
  <line x1="${x1-40}" y1="${yt}" x2="${hx+12}" y2="${yt}" stroke="#0B2A55" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
  <line x1="${x1+4}" y1="${yb}" x2="${hx+12}" y2="${yb}" stroke="#0B2A55" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>
  <line x1="${hx}" y1="${yt}" x2="${hx}" y2="${hm-62}" stroke="#0B2A55" stroke-width="1.6"/><line x1="${hx}" y1="${hm+62}" x2="${hx}" y2="${yb}" stroke="#0B2A55" stroke-width="1.6"/>
  ${tick(hx,yt,1)}${tick(hx,yb,1)}<text class="dl" transform="translate(${hx+6},${hm}) rotate(-90)" text-anchor="middle">${c.hgt}</text></svg>`;
 g+=(c.pts||[]).map((p,i)=>`<div class="num" style="left:${X(p[0])-19}px;top:${Y(p[1])-19}px">${i+1}</div>`).join('');
 return g;
}
function render(c){
 document.getElementById('pat').innerHTML=jewel(c.pattern);
 document.body.className=c.kind==='review'?'rv':c.kind==='emiday'?'em':c.kind==='sheet'?'sh':'sp';
 document.body.setAttribute('style',Object.entries(c.vars||{}).map(([k,v])=>`--${k}:${v}`).join(';'));
 let h=`<header><img src="${c.logo}" style="height:${c.logoH}px"></header>`;
 if(c.kind==='review'){
  h+=`${c.kicker?`<div class="kick"><span style="width:30px;height:30px;display:inline-block">${G}</span>${c.kicker}</div>`:''}<h1>${c.headline}</h1>
  <div class="card"><div class="top"><div class="av" style="background:${c.avc}">${c.name[0]}</div><div class="who"><b>${c.name}</b><span>${c.place}</span></div><div class="g">${G}</div></div>
  <div class="stars"><i>★★★★★</i>${c.when||''}</div><div class="rtext">${c.text}</div></div>
  ${c.photo?`<div class="pcard" style="left:${c.photo.x}px;top:${c.photo.y}px;width:${c.photo.w}px;height:${c.photo.h}px;transform:rotate(${c.photo.r??-3}deg)"><img src="${c.photo.src}" style="object-position:${c.photo.pos||'center'}"></div>`:''}`;
 } else if(c.kind==='emiday'){
  h+=`<div class="kick">${c.kicker}</div><div class="l1">${c.l1}</div><div class="big">${c.big}</div>${car(c)}
  <div class="calc">${Array.isArray(c.calc)?`<div class="ch">HOW WE WORKED IT OUT</div>${c.calc.slice(0,-1).map(r=>`<div class="r"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}<div class="t"><span>${c.calc.at(-1)[0]}</span><b>${c.calc.at(-1)[1]}</b></div>`:c.calc}</div><div class="det">${c.det}<br><span class="pill">${c.cta}</span></div>`;
 } else if(c.kind==='sheet'){
  h+=`<div class="kick"><span>${c.kicker}</span><small>${c.sheetno||''}</small></div><h1>${c.headline}</h1>${car(c)}${sheet(c)}
  <div class="legend">${c.legend.map((t,i)=>`<div><i>${i+1}</i>${t}</div>`).join('')}</div>
  <div class="data">${c.data}<br><span class="pill">${c.cta}</span></div>`;
 } else {
  h+=`<div class="kick">${c.kicker}</div><div class="model">${c.model}</div>${car(c)}<div class="tag"><h1>${c.headline}</h1><div class="feats">${c.feats.map(f=>`<span>${f}</span>`).join('')}</div></div>`;
 }
 h+=hands(c)+`<footer>${FOOT[c.footer]}</footer>${c.fine?`<div class="fine">${c.fine}</div>`:''}`;
 document.getElementById('root').innerHTML=h;
 const q=s=>{const e=document.querySelector(s);if(!e)return null;const b=e.getBoundingClientRect();return [Math.round(b.left),Math.round(b.top),Math.round(b.right),Math.round(b.bottom)]};
 return {h1:q('h1'),card:q('.card'),big:q('.big'),calc:q('.calc'),det:q('.det'),car:q('.car'),model:q('.model'),tag:q('.tag'),foot:q('footer')};
}
</script></body></html>
