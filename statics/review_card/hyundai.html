<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;font-weight:500;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-500-normal.woff2)}
@font-face{font-family:Mont;font-weight:600;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Mont;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Mont;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
/* Hyundai dealer posts, modelled on @hyundaiindia's own creatives (user, 9 Nov 2026): sentence case, light type,
   big photography, a small Active Blue label, thin outline pills. Dark (BAYON black), light (studio) or photo. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Mont,sans-serif;position:relative;--blue:#00AAD2;--navy:#002C5F}
.dark{color:#fff;background:#000}
.dark .bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 75% 35%,#2a2b2e 0%,#0d0d0e 55%,#000 85%)}
.light{color:var(--navy);background:#eef0f3}
.light .bg{position:absolute;inset:0;background:radial-gradient(1000px 800px at 50% 45%,#ffffff 0%,#f1f3f6 50%,#dfe3e8 100%)}
.photo .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.photo.ink-navy{color:var(--navy)} .photo.ink-white{color:#fff}
.photo .veil{position:absolute;inset:0}
.ink-white .veil{background:linear-gradient(180deg,rgba(0,8,20,.78) 0%,rgba(0,8,20,.55) 22%,rgba(0,8,20,.05) 40%,rgba(0,8,20,0) 52%,rgba(0,8,20,.55) 74%,rgba(0,10,24,.92) 100%)}
.ink-navy .veil{background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 58%,rgba(255,255,255,.75) 78%,rgba(255,255,255,.95) 100%)}
.car{position:absolute;left:0;right:0;top:var(--ct,420px);height:var(--ch,520px);background-size:cover;background-position:var(--cp,center);
 -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 80%,transparent 100%)}
.light .car{-webkit-mask-image:radial-gradient(70% 60% at 50% 50%,#000 60%,transparent 100%);mask-image:radial-gradient(70% 60% at 50% 50%,#000 60%,transparent 100%)}
header{position:absolute;left:72px;right:72px;top:64px;height:130px;display:flex;align-items:center;justify-content:space-between}
header img{display:block}
.tag{font-weight:600;font-size:22px;padding:10px 22px;border:1.5px solid currentColor;border-radius:40px;opacity:.9}
.head{position:absolute;left:72px;right:72px;top:228px}
.label{display:inline-block;background:var(--blue);color:#fff;font-weight:700;font-size:22px;padding:7px 14px;letter-spacing:.3px}
h1{margin-top:20px;font-weight:700;font-size:var(--h1,96px);line-height:1.02;letter-spacing:-2px}
.sub{margin-top:16px;font-weight:500;font-size:30px;line-height:1.3;max-width:900px;opacity:.88}
.price{position:absolute;left:72px;top:var(--pt,900px)}
.price small{display:block;font-weight:600;font-size:24px;opacity:.9}
.price b{display:block;font-weight:700;font-size:72px;line-height:1.05;letter-spacing:-1px}
.pills{position:absolute;left:72px;right:72px;top:var(--pl,1045px);display:flex;flex-wrap:wrap;gap:12px}
.pill{font-weight:600;font-size:22px;padding:10px 20px;border:1.5px solid currentColor;border-radius:40px;opacity:.95}
.card{position:absolute;left:72px;right:72px;top:var(--pt,830px);display:flex;border-radius:20px;overflow:hidden}
.dark .card,.ink-white .card{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px)}
.light .card,.ink-navy .card{background:#fff;box-shadow:0 18px 40px rgba(0,44,95,.18);color:var(--navy)}
.ink-white .card{background:rgba(255,255,255,.94);color:var(--navy);border:0}
.tbl{flex:1.5;padding:20px 30px}
.tr{display:flex;justify-content:space-between;align-items:baseline;font-weight:500;font-size:24px;padding:8px 0;border-bottom:1px solid rgba(127,140,160,.25)}
.tr b{font-weight:700;font-variant-numeric:tabular-nums}
.tr.tot{border-bottom:0;padding-top:12px;font-weight:700;font-size:26px}
.tr.tot b{font-size:34px}
.emi{flex:1;padding:26px 28px;border-left:1px solid rgba(127,140,160,.3);display:flex;flex-direction:column;justify-content:center}
.emi small{font-weight:700;font-size:20px;color:var(--blue);letter-spacing:1px}
.emi b{display:block;font-weight:700;font-size:56px;line-height:1.05;margin:6px 0 2px;letter-spacing:-1px}
.emi i{font-style:normal;font-weight:600;font-size:22px}
.emi p{margin-top:12px;font-weight:500;font-size:19px;line-height:1.35;opacity:.85}
footer{position:absolute;left:0;right:0;bottom:0;height:230px;padding:0 72px 64px;display:flex;flex-direction:column;justify-content:flex-end}
.fine{position:absolute;left:72px;right:72px;bottom:18px;font-weight:500;font-size:14px;opacity:.65;text-align:center}
.rule{display:flex;align-items:center;gap:20px;font-weight:700;font-size:22px;letter-spacing:4px;margin-bottom:22px}
.rule:before,.rule:after{content:"";flex:1;height:2px;background:currentColor;opacity:.3}
.cols{display:flex;justify-content:space-between}
.cols div{font-weight:600;font-size:22px;opacity:.85}
.cols div b{display:block;font-weight:800;font-size:27px;opacity:1;margin-top:6px;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.big{font-weight:800;font-size:34px;letter-spacing:1px}
.ph{font-weight:800;font-size:40px;white-space:nowrap}
.fsub{margin-top:14px;font-weight:600;font-size:22px;letter-spacing:2px;opacity:.85}
.loc{white-space:nowrap;text-align:right;font-weight:600;font-size:22px;line-height:1.4;opacity:.95}
.loc b{font-weight:800;font-size:26px;letter-spacing:3px}
.pin{color:var(--blue)}
</style></head><body><div id="root"></div>
<script>
const FOOT={
 CH:`<div class="rule">CAPITAL HYUNDAI SHOWROOMS</div><div class="cols"><div>Sector 63, Noida<b>99994 89444</b></div><div>Sector 132, Noida<b>73031 11937</b></div><div>Dadri<b>72900 77273</b></div><div>Faridabad<b>93559 31054</b></div></div>`,
 DEH:`<div class="row"><div class="big">DEE EMM HYUNDAI GURGAON</div><div class="ph">97736 47900</div></div><div class="fsub">SECTOR 16 | SECTOR 49 · DAULATABAD · SECTOR 18 | SIKANDERPUR</div>`,
 MRH:`<div class="row"><div><div class="big">SHOWROOM &amp; SERVICE</div><div class="fsub">Loni Rd, opp. Shalimar Garden, Pasonda, Sahibabad</div></div><div class="loc"><b><span class="pin">&#9679;</span> GHAZIABAD</b><br>Pasonda, Shalimar Garden<br><span class="ph">93128 21182</span></div></div>`};
function render(c){
 document.body.className=c.mode+(c.ink?' ink-'+c.ink:'');
 document.body.setAttribute('style',Object.entries(c.vars||{}).map(([k,v])=>`--${k}:${v}`).join(';'));
 const bg=c.mode==='photo'?`<div class="bg" style="background-image:url(${c.img})"></div><div class="veil"></div>`:`<div class="bg"></div><div class="car" style="background-image:url(${c.img})"></div>`;
 let body='';
 if(c.kind==='spot') body=`<div class="price"><small>${c.priceLabel}</small><b>${c.price}</b></div><div class="pills">${c.chips.map(x=>`<div class="pill">${x}</div>`).join('')}</div>`;
 else body=`<div class="card"><div class="tbl">${c.rows.map(([k,v])=>`<div class="tr"><span>${k}</span><b>${v}</b></div>`).join('')}<div class="tr tot"><span>${c.totalLabel}</span><b>${c.total}</b></div></div>
  <div class="emi"><small>EMI FROM</small><b>${c.emi}</b><i>per month*</i><p>${c.emiNote}</p></div></div>`;
 document.getElementById('root').innerHTML=`${bg}<header><img src="${c.logo}" style="height:${c.logoH}px"><div class="tag">${c.tag}</div></header>
 <div class="head"><span class="label">${c.label}</span><h1>${c.headline}</h1><div class="sub">${c.sub}</div></div>${body}
 <footer>${FOOT[c.footer]}</footer><div class="fine">${c.fine}</div>`;
 const h=document.querySelector('.head').getBoundingClientRect(), b=(document.querySelector('.card')||document.querySelector('.pills')).getBoundingClientRect();
 return {headBottom:Math.round(h.bottom), bodyTop:Math.round(b.top), bodyBottom:Math.round(b.bottom)};
}
</script></body></html>
