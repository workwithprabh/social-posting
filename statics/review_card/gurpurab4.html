<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;font-weight:500;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-500-normal.woff2)}
@font-face{font-family:Mont;font-weight:600;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Mont;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Mont;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Play;font-weight:700;font-style:italic;src:url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-italic.woff2)}
@font-face{font-family:Gur;font-weight:700;src:url(node_modules/@fontsource/noto-serif-gurmukhi/files/noto-serif-gurmukhi-gurmukhi-700-normal.woff2)}
/* Gurpurab post, night design (fourth design, M R Hyundai, 24 Nov 2026): a full-bleed night photo of a gurdwara and its
   sarovar, everything centred, the logo centred at the top, a thin gold frame, the wish in the dark sky above the
   building and the teaching over the dark water below it. Nothing in the top-right corner. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Mont,sans-serif;color:#fff;background:#020203;position:relative;--g1:#fff3cf;--g2:#f2c46b;--g3:#c98a2c}
.bg{position:absolute;left:0;right:0;top:var(--py,80px);height:1350px;background-repeat:no-repeat;background-size:var(--bs,cover);background-position:var(--bx,center) top}
.glow{position:absolute;left:50%;top:var(--gy,330px);width:var(--gw,700px);height:var(--gw,700px);transform:translate(-50%,-50%);border-radius:50%;z-index:1;
 background:radial-gradient(closest-side,rgba(255,200,110,.22),rgba(255,190,90,.08) 55%,rgba(255,190,90,0) 100%)}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,2,3,1) 0,rgba(2,2,3,.6) 9%,rgba(2,2,3,0) 22%,rgba(2,2,3,0) 64%,rgba(2,2,3,.55) 72%,rgba(2,2,3,.82) 84%,rgba(2,2,3,.95) 100%)}
.frame{position:absolute;inset:22px;border:1.5px solid rgba(242,196,107,.55);z-index:4;pointer-events:none}
.frame:before,.frame:after{content:"";position:absolute;left:50%;width:12px;height:12px;background:var(--g2);transform:translateX(-50%) rotate(45deg)}
.frame:before{top:-7px}.frame:after{bottom:-7px}
header{position:absolute;left:0;right:0;top:var(--lt,52px);display:flex;justify-content:center;z-index:3}
.top{position:absolute;left:60px;right:60px;top:var(--tt,170px);text-align:center;z-index:3}
.gold{background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.gwish{font-family:Gur;font-weight:700;font-size:38px;line-height:1.3;padding-top:4px}
h1{font-weight:700;font-size:var(--h1,76px);line-height:1.04;letter-spacing:-1.5px;margin-top:2px;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.les{position:absolute;left:60px;right:60px;top:var(--st,950px);text-align:center;z-index:3}
.orn{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px}
.orn i{display:block;width:150px;height:1.5px;background:linear-gradient(90deg,transparent,var(--g2))}
.orn i:last-child{background:linear-gradient(90deg,var(--g2),transparent)}
.orn b{width:9px;height:9px;background:var(--g2);transform:rotate(45deg)}
.row{display:flex;align-items:baseline;justify-content:center;gap:24px}
.gur{font-family:Gur;font-weight:700;font-size:var(--gs,56px);line-height:1.25}
.lname{font-family:Play;font-style:italic;font-weight:700;font-size:var(--ls,62px);line-height:1.1}
.meaning{margin-top:4px;font-weight:700;font-size:30px;color:var(--g2)}
.line{margin-top:6px;font-weight:500;font-size:24px;line-height:1.4;opacity:.88}
footer{position:absolute;left:60px;right:60px;bottom:var(--fb,54px);text-align:center;z-index:3}
.fr{height:1px;background:rgba(242,196,107,.35);margin:0 60px 16px}
.big{font-weight:800;font-size:26px;letter-spacing:1.5px}
.big .ph{color:var(--g2);margin-left:4px}
.fsub{margin-top:6px;font-weight:600;font-size:18px;letter-spacing:1.5px;opacity:.8}
.note{position:absolute;left:60px;right:60px;bottom:var(--nb,32px);font-weight:500;font-size:11.5px;opacity:.5;text-align:center;z-index:3}
</style></head><body><div id="root"></div>
<script>
const FOOT={
 MRH:`<div class="fr"></div><div class="big">M R HYUNDAI · SHOWROOM &amp; SERVICE · <span class="ph">93128 21182</span></div><div class="fsub">LONI ROAD, OPP. SHALIMAR GARDEN, PASONDA, GHAZIABAD</div>`};
function render(c){
 document.body.setAttribute('style',Object.entries(c.vars||{}).map(([k,v])=>`--${k}:${v}`).join(';'));
 document.getElementById('root').innerHTML=`<div class="bg" style="background-image:url(${c.img})"></div><div class="veil"></div>${c.glow?'<div class="glow"></div>':''}<div class="frame"></div>
 <header><img src="${c.logo}" style="height:${c.logoH}px"></header>
 <div class="top"><div class="gwish gold">${c.gwish}</div><h1>${c.wish}</h1></div>
 <div class="les"><div class="orn"><i></i><b></b><i></i></div>
  <div class="row"><div class="gur gold">${c.gur}</div><div class="lname">${c.lesson}</div></div>
  <div class="meaning">${c.meaning}</div><div class="line">${c.line}</div></div>
 <footer>${FOOT[c.footer]}</footer>${c.note?`<div class="note">${c.note}</div>`:''}`;
 const t=document.querySelector('.les').getBoundingClientRect(), f=document.querySelector('footer').getBoundingClientRect(), h=document.querySelector('.top').getBoundingClientRect();
 return {topBottom:Math.round(h.bottom),lesTop:Math.round(t.top),lesBottom:Math.round(t.bottom),footTop:Math.round(f.top)};
}
</script></body></html>
