<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:Mont;font-weight:500;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-500-normal.woff2)}
@font-face{font-family:Mont;font-weight:600;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Mont;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Mont;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Gur;font-weight:700;src:url(node_modules/@fontsource/noto-serif-gurmukhi/files/noto-serif-gurmukhi-gurmukhi-700-normal.woff2)}
/* Gurpurab post, diagonal split (sixth design, Dee Emm Mahindra, 24 Nov 2026): the gurdwara photo across the top with a
   Mahindra-style diagonal edge and red stripe, charcoal below, the Guru Nanak Dev Ji illustration on the left in a warm
   glow, the wish and the teaching on the right, a red label naming the gurdwara. Nothing in the top-right corner. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Mont,sans-serif;color:#fff;position:relative;background:#141416;--red:#E31837;--g1:#fff1c9;--g2:#f6c66e;--g3:#d08f2e}
.base{position:absolute;inset:0;background:radial-gradient(900px 700px at 25% 70%,#2a2a2f 0%,#17171a 60%,#0f0f11 100%)}
.stripe{position:absolute;left:0;right:0;top:0;height:var(--ph,700px);background:var(--red);clip-path:polygon(0 0,100% 0,100% calc(var(--dr,560px) + 12px),0 calc(var(--dl,680px) + 12px));z-index:1}
.photo{position:absolute;left:0;right:0;top:0;height:var(--ph,700px);background:var(--img) var(--pp,center top)/var(--ps,cover) no-repeat;clip-path:polygon(0 0,100% 0,100% var(--dr,560px),0 var(--dl,680px));z-index:2}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,14,.55) 0,rgba(8,10,14,0) 22%,rgba(8,10,14,0) 70%,rgba(8,10,14,.35) 100%)}
.label{position:absolute;left:72px;top:var(--lbt,560px);z-index:3}
.label b{display:inline-block;background:var(--red);font-weight:800;font-size:18px;letter-spacing:2px;padding:8px 14px}
.label span{display:block;margin-top:6px;font-weight:600;font-size:17px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.glow{position:absolute;left:var(--gx,290px);top:var(--gy,830px);width:var(--gw,620px);height:var(--gw,620px);transform:translate(-50%,-50%);border-radius:50%;z-index:1;
 background:radial-gradient(closest-side,rgba(255,214,140,.55) 0%,rgba(255,180,90,.22) 45%,rgba(255,160,80,0) 100%)}
.fig{position:absolute;left:var(--fx,0px);top:var(--fy,530px);width:var(--fw,560px);z-index:1;
 -webkit-mask-image:linear-gradient(180deg,#000 var(--m1,78%),transparent var(--m2,92%)),linear-gradient(90deg,#000 var(--r1,80%),transparent var(--r2,98%));-webkit-mask-composite:source-in;
 mask-image:linear-gradient(180deg,#000 var(--m1,78%),transparent var(--m2,92%)),linear-gradient(90deg,#000 var(--r1,80%),transparent var(--r2,98%));mask-composite:intersect}
header{position:absolute;left:72px;top:58px;z-index:3}
.txt{position:absolute;left:var(--tx,590px);right:60px;top:var(--tt,700px);z-index:3}
.gwish{font-family:Gur;font-weight:700;font-size:var(--gs,30px);line-height:1.3;color:var(--g2)}
h1{font-family:Anton;font-weight:400;text-transform:uppercase;font-size:var(--h1,104px);line-height:.98;letter-spacing:1px;margin-top:6px}
.rule{width:90px;height:5px;background:var(--red);margin:22px 0 16px}
.lrow{display:flex;align-items:baseline;gap:18px}
.gur{font-family:Gur;font-weight:700;font-size:62px;line-height:1.2;background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.lname{font-family:Anton;font-size:76px;line-height:1;letter-spacing:1px;text-transform:uppercase}
.meaning{margin-top:8px;font-weight:700;font-size:27px;line-height:1.3;color:var(--g2)}
.line{margin-top:8px;font-weight:500;font-size:21px;line-height:1.4;opacity:.85}
footer{position:absolute;left:0;right:0;bottom:0;height:140px;background:#0b0b0d;border-top:1px solid rgba(255,255,255,.08);padding:0 72px;display:flex;align-items:center;justify-content:space-between;z-index:4}
.big{font-family:Anton;font-size:38px;letter-spacing:1.5px;line-height:1.05}
.fsub{margin-top:6px;font-weight:600;font-size:13.5px;letter-spacing:1px;opacity:.75;white-space:nowrap}
.ph{text-align:right;font-family:Anton;font-size:44px;letter-spacing:1px;line-height:1;white-space:nowrap;margin-left:24px}
.ph small{display:block;font-family:Mont;font-weight:700;font-size:14px;letter-spacing:3px;color:var(--red);margin-bottom:6px}
.note{position:absolute;left:72px;right:72px;bottom:146px;font-weight:500;font-size:11px;opacity:.55;z-index:4}
</style></head><body><div id="root"></div>
<script>
const FOOT={
 DEM:`<div><div class="big">DEE EMM MAHINDRA</div><div class="fsub">SECTOR 18 · SECTOR 61 · GOLF COURSE RD · MG ROAD · PATAUDI · DAULATABAD</div></div><div class="ph"><small>CALL</small>95995 58379</div>`};
function render(c){
 document.body.setAttribute('style',Object.entries(c.vars||{}).map(([k,v])=>`--${k}:${v}`).join(';')+`;--img:url(${c.img})`);
 document.getElementById('root').innerHTML=`<div class="base"></div><div class="glow"></div><img class="fig" src="${c.fig}"><div class="stripe"></div><div class="photo"></div>
 <div class="label"><b>${c.place}</b><span>${c.placeSub}</span></div>
 <header><img src="${c.logo}" style="height:${c.logoH}px"></header>
 <div class="txt"><div class="gwish">${c.gwish}</div><h1>${c.wish}</h1><div class="rule"></div>
  <div class="lrow"><div class="gur">${c.gur}</div><div class="lname">${c.lesson}</div></div>
  <div class="meaning">${c.meaning}</div>${c.line?`<div class="line">${c.line}</div>`:''}</div>
 <footer>${FOOT[c.footer]}</footer>${c.note?`<div class="note">${c.note}</div>`:''}`;
 const b=document.querySelector('.txt').getBoundingClientRect();
 return {txtTop:Math.round(b.top),txtBottom:Math.round(b.bottom)};
}
</script></body></html>
