<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:Mont;font-weight:500;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-500-normal.woff2)}
@font-face{font-family:Mont;font-weight:600;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Mont;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Mont;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Gur;font-weight:700;src:url(node_modules/@fontsource/noto-serif-gurmukhi/files/noto-serif-gurmukhi-gurmukhi-700-normal.woff2)}
/* Gurpurab post, Mahindra red design (fifth design, Arav Mahindra, 24 Nov 2026): deep Mahindra red, Anton caps on the
   left, the Guru Nanak Dev Ji illustration large on the right in a warm glow, a tilted photo card of the gurdwara with
   its name, the teaching with outline chips, a charcoal footer with a red pill. Nothing in the top-right corner. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Mont,sans-serif;color:#fff;position:relative;background:#6e0717;--red:#E31837;--g1:#fff1c9;--g2:#f6c66e;--g3:#d08f2e}
.bg{position:absolute;inset:0;background:radial-gradient(900px 1000px at 78% 38%,#c3132f 0%,#9a0c22 45%,#5e0513 100%)}
.bg:after{content:"";position:absolute;left:-200px;top:-140px;width:520px;height:1800px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0));transform:rotate(24deg)}
.glow{position:absolute;left:var(--gx,820px);top:var(--gy,360px);width:var(--gw,820px);height:var(--gw,820px);transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(closest-side,rgba(255,226,160,.85) 0%,rgba(255,190,100,.45) 40%,rgba(255,160,80,.12) 72%,rgba(255,160,80,0) 100%)}
.rays{position:absolute;left:var(--gx,820px);top:var(--gy,360px);width:1300px;height:1300px;transform:translate(-50%,-50%);border-radius:50%;
 background:repeating-conic-gradient(from 0deg,rgba(255,220,160,.12) 0 3deg,rgba(255,220,160,0) 3deg 10deg);
 -webkit-mask-image:radial-gradient(closest-side,#000 25%,transparent 85%);mask-image:radial-gradient(closest-side,#000 25%,transparent 85%)}
.fig{position:absolute;left:var(--fx,420px);top:var(--fy,0px);width:var(--fw,820px);
 -webkit-mask-image:linear-gradient(180deg,#000 var(--m1,80%),transparent var(--m2,97%));mask-image:linear-gradient(180deg,#000 var(--m1,80%),transparent var(--m2,97%));
 filter:drop-shadow(0 10px 30px rgba(60,0,10,.45))}
header{position:absolute;left:72px;top:60px;z-index:3}
.txt{position:absolute;left:72px;top:var(--tt,196px);width:var(--tw,560px);z-index:3}
.gwish{font-family:Gur;font-weight:700;font-size:34px;line-height:1.3;color:var(--g2)}
h1{font-family:Anton;font-weight:400;text-transform:uppercase;font-size:var(--h1,138px);line-height:.98;letter-spacing:1px;margin-top:6px;text-shadow:0 6px 24px rgba(60,0,10,.4)}
.card{position:absolute;left:var(--cx,72px);top:var(--cy,540px);width:var(--cw,420px);padding:12px 12px 0;background:#fff;border-radius:4px;transform:rotate(var(--cr,-3deg));z-index:3;
 box-shadow:0 22px 44px rgba(40,0,8,.55)}
.card img{display:block;width:100%;height:var(--ch,230px);object-fit:cover;object-position:var(--cp,center)}
.card p{font-weight:700;font-size:15px;line-height:1.35;color:#2a1a14;padding:10px 4px 12px}
.card p span{display:block;font-weight:500;color:#7a5a4a}
.les{position:absolute;left:72px;top:var(--lt,850px);width:var(--lw,560px);z-index:3}
.lrow{display:flex;align-items:center;gap:20px}
.ek{font-family:Gur;font-weight:700;font-size:96px;line-height:1;padding-top:22px;background:linear-gradient(180deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.lname{font-family:Anton;font-size:84px;line-height:1;letter-spacing:1px;text-transform:uppercase}
.meaning{margin-top:10px;font-weight:700;font-size:30px;line-height:1.25;color:var(--g2)}
.chips{display:flex;gap:12px;margin-top:20px}
.chips span{font-weight:700;font-size:20px;padding:9px 18px;border:2px solid rgba(255,255,255,.85);border-radius:40px}
footer{position:absolute;left:0;right:0;bottom:0;height:150px;background:#141416;padding:0 72px;display:flex;align-items:center;justify-content:space-between;z-index:4}
footer:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--red)}
.big{font-family:Anton;font-size:40px;letter-spacing:1.5px;line-height:1.05}
.fsub{margin-top:6px;font-weight:600;font-size:18px;letter-spacing:2px;opacity:.8}
.pill{background:var(--red);border-radius:50px;padding:14px 28px;font-weight:800;font-size:30px;white-space:nowrap}
.pill small{display:block;font-weight:600;font-size:15px;letter-spacing:2px;opacity:.9;margin-bottom:2px}
.note{position:absolute;left:72px;right:72px;bottom:156px;font-weight:500;font-size:11.5px;opacity:.6;text-align:left;z-index:4}
</style></head><body><div id="root"></div>
<script>
const FOOT={
 AM:`<div><div class="big">MAHINDRA ARAV</div><div class="fsub">MANESAR · SECTOR 95 · SECTOR 83, GURGAON</div></div><div class="pill"><small>CALL US</small>88600 86639</div>`};
function render(c){
 document.body.setAttribute('style',Object.entries(c.vars||{}).map(([k,v])=>`--${k}:${v}`).join(';'));
 document.getElementById('root').innerHTML=`<div class="bg"></div><div class="rays"></div><div class="glow"></div><img class="fig" src="${c.fig}">
 <header><img src="${c.logo}" style="height:${c.logoH}px"></header>
 <div class="txt"><div class="gwish">${c.gwish}</div><h1>${c.wish}</h1></div>
 <div class="card"><img src="${c.photo}"><p>${c.photoTitle}<span>${c.photoSub}</span></p></div>
 <div class="les"><div class="lrow"><div class="ek">${c.gur}</div><div class="lname">${c.lesson}</div></div>
  <div class="meaning">${c.meaning}</div><div class="chips">${(c.chips||[]).map(x=>`<span>${x}</span>`).join('')}</div></div>
 <footer>${FOOT[c.footer]}</footer>${c.note?`<div class="note">${c.note}</div>`:''}`;
 const r=s=>{const b=document.querySelector(s).getBoundingClientRect();return [Math.round(b.top),Math.round(b.bottom),Math.round(b.right)]};
 return {txt:r('.txt'),card:r('.card'),les:r('.les')};
}
</script></body></html>
